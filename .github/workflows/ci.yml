name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Test & Build Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit & integration tests
        run: npm test

      - name: Run ops & script tests
        run: npm run test:ops

      - name: Astro type check
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Automated security audit
        run: npm run audit:security

      - name: Health endpoint smoke test
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const entry = path.join('dist', 'server', 'entry.mjs');
            if (!fs.existsSync(entry)) {
              console.log('SKIP: SSR entry not found (static build)');
              process.exit(0);
            }
            console.log('SSR entry found — health endpoint will be validated at deploy time.');
          "
